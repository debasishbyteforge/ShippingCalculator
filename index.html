<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Shipping Calculator</h1>
        <p>Calculate your package delivery cost</p>

        <label for="weight">Package Weight (kg):</label>
        <input type="number" id="weight" placeholder="Enter weight">

        <label for="distance">Delivery Distance (km):</label>
        <input type="number" id="distance" placeholder="Enter distance">

        <button onclick="calculateShipping()">
            Calculate Shipping
        </button>

        <h2 id="result">Shipping Cost: ₹0</h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
